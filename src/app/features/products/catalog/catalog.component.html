<section class="container my-5">
  <h2 class="fw-bold text-center mb-50">{{ title }}</h2>

  <div class="d-flex justify-content-center my-5" *ngIf="loading">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="alert alert-danger" *ngIf="error">Не удалось загрузить товары. Попробуйте обновить страницу.</div>
  <div class="alert alert-warning text-center" *ngIf="!loading && !error && products.length === 0">Ничего не найдено</div>

  <div class="row g-4" *ngIf="!loading && !error && products.length > 0">
    <div class="col-md-4 col-sm-6" *ngFor="let product of products">
      <div class="card h-100">
        <img [src]="product.image" [alt]="product.title" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold">{{ product.title }}</h5>
          <p class="card-text flex-grow-1">{{ product.description }}</p>
          <div class="fw-bold mb-3">{{ product.price }} ₽</div>
          <a class="btn btn-primary mt-auto" [routerLink]="['/product', product.id]">Подробнее</a>
        </div>
      </div>
    </div>
  </div>
</section>
