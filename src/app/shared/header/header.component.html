<nav class="navbar navbar-expand-lg navbar-light bg-light w-100">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-bold" routerLink="/">Logo</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Переключатель навигации">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Главная</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/catalog" routerLinkActive="active">Каталог</a>
        </li>
      </ul>

      <form class="d-flex" (ngSubmit)="search()">
        <input class="form-control me-2" type="search" name="search" placeholder="Поиск чая" aria-label="Search" [(ngModel)]="searchValue">
        <button class="btn btn-outline-primary search-btn" type="submit">Найти</button>
        <button class="btn btn-outline-secondary ms-2 reset-btn" type="button" (click)="resetSearch()" *ngIf="searchValue">Сброс</button>
      </form>
    </div>
  </div>
</nav>
